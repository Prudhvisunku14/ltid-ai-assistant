<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Ticket Manager</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2330; --muted:#667085; --line:#e4e7ec; --accent:#3b5bdb;
          --open:#e8590c; --prog:#1c7ed6; --done:#2f9e44; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b2029; --text:#e6e9ef; --muted:#98a2b3; --line:#2a313d; --accent:#748ffc; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; padding:16px 24px; border-bottom:1px solid var(--line); background:var(--card); }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:15px; margin:0 0 12px; }
  main { max-width:1200px; margin:0 auto; padding:20px 24px 48px; display:grid; gap:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .tile { border:1px solid var(--line); border-radius:8px; padding:12px; }
  .tile b { display:block; font-size:28px; }
  .tile span { color:var(--muted); font-size:13px; }
  .bars { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; margin-top:16px; }
  .bar { display:grid; grid-template-columns:110px 1fr 30px; gap:8px; align-items:center; font-size:13px; margin:4px 0; }
  .bar i { display:block; height:8px; border-radius:4px; background:var(--accent); min-width:2px; }
  form { display:grid; gap:10px; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
  label { font-size:13px; color:var(--muted); display:grid; gap:4px; }
  input[type=text], textarea, select { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); width:100%; }
  textarea { min-height:90px; resize:vertical; }
  .check { display:flex; align-items:center; gap:8px; color:var(--text); font-size:14px; }
  button { font:inherit; padding:9px 16px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; justify-self:start; }
  button:disabled { opacity:.6; cursor:wait; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .filters select { width:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-top:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; border-top:0; }
  td select { width:auto; min-width:120px; padding:5px; }
  .desc { color:var(--muted); font-size:13px; margin-top:2px; white-space:pre-wrap; word-break:break-word; }
  .why { font-size:12px; color:var(--muted); margin-top:6px; }
  .src { font-size:11px; color:var(--muted); margin-top:3px; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; border:1px solid var(--line); margin-right:4px; }
  .err { color:#e03131; font-size:13px; min-height:18px; }
  .empty { color:var(--muted); text-align:center; padding:24px; }
  .st-open { color:var(--open); } .st-in_progress { color:var(--prog); } .st-resolved { color:var(--done); }
  @media (max-width:760px) { th:nth-child(1), td:nth-child(1) { display:none; } }
</style>
</head>
<body>
<header>
  <h1>Support Ticket Manager</h1>
  <span id="clf" class="badge"></span>
</header>
<main>
  <section class="card">
    <h2>Dashboard</h2>
    <div class="tiles" id="tiles"></div>
    <div class="bars">
      <div><h2>By category</h2><div id="byCat"></div></div>
      <div><h2>By priority</h2><div id="byPri"></div></div>
    </div>
    <div class="why" id="corrected"></div>
  </section>

  <section class="card">
    <h2>Submit a ticket</h2>
    <form id="form">
      <label>Title <input type="text" id="title" maxlength="200" required minlength="3"></label>
      <label>Description <textarea id="desc" maxlength="5000" required minlength="5"></textarea></label>
      <label class="check"><input type="checkbox" id="auto" checked> Classify automatically with AI</label>
      <div class="row">
        <label id="catWrap" hidden>Category (manual)
          <select id="cat"></select></label>
        <label>Priority <select id="pri"></select></label>
      </div>
      <div class="err" id="err"></div>
      <button id="submit" type="submit">Submit ticket</button>
    </form>
  </section>

  <section class="card">
    <h2>Tickets</h2>
    <div class="filters">
      <select id="fStatus"></select><select id="fCat"></select><select id="fPri"></select>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>ID</th><th>Ticket &amp; AI reasoning</th><th>Category</th><th>Priority</th><th>Status</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const CATS = [["technical_issue","Technical issue"],["billing","Billing"],["general_inquiry","General inquiry"]];
const PRIS = [["low","Low"],["medium","Medium"],["high","High"],["urgent","Urgent"]];
const STATS = [["open","Open"],["in_progress","In progress"],["resolved","Resolved"]];
const label = (list, v) => (list.find(x => x[0] === v) || [v, v])[1];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const options = (list, selected, first) =>
  (first ? `<option value="">${first}</option>` : "") +
  list.map(([v, l]) => `<option value="${v}" ${v === selected ? "selected" : ""}>${l}</option>`).join("");

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!res.ok) {
    let msg = res.statusText;
    try {
      const j = await res.json();
      msg = typeof j.detail === "string" ? j.detail : j.detail.map(d => d.msg).join("; ");
    } catch (_) {}
    throw new Error(msg);
  }
  return res.json();
}

function sourceNote(src, aiValue, current, list) {
  if (src === "manual") {
    const was = aiValue && aiValue !== current ? ` (AI suggested: ${esc(label(list, aiValue))})` : "";
    return `Set manually${was}`;
  }
  return { ai: "Suggested by GPT", rules: "Suggested by rules", default: "Default" }[src] || esc(src);
}

function renderStats(s) {
  $("tiles").innerHTML =
    `<div class="tile"><b>${s.total}</b><span>Total tickets</span></div>` +
    STATS.map(([k, l]) => `<div class="tile"><b class="st-${k}">${s.by_status[k]}</b><span>${l}</span></div>`).join("");
  const bars = (counts, list) => {
    const max = Math.max(1, ...Object.values(counts));
    return list.map(([k, l]) =>
      `<div class="bar"><span>${l}</span><i style="width:${(counts[k] / max) * 100}%"></i><b>${counts[k]}</b></div>`).join("");
  };
  $("byCat").innerHTML = bars(s.by_category, CATS);
  $("byPri").innerHTML = bars(s.by_priority, PRIS);
  $("corrected").textContent = `${s.manually_corrected} ticket(s) where a person overrode the AI suggestion.`;
}

function renderRows(tickets) {
  if (!tickets.length) { $("rows").innerHTML = `<tr><td colspan="5" class="empty">No tickets yet.</td></tr>`; return; }
  $("rows").innerHTML = tickets.map(t => `
    <tr data-id="${t.id}">
      <td>#${t.id}</td>
      <td><strong>${esc(t.title)}</strong>
          <div class="desc">${esc(t.description)}</div>
          <div class="why"><span class="badge">${esc(t.priority_source)}</span>${esc(t.priority_reasoning)}</div></td>
      <td><select data-field="category">${options(CATS, t.category)}</select>
          <div class="src">${sourceNote(t.category_source, t.ai_category, t.category, CATS)}</div></td>
      <td><select data-field="priority">${options(PRIS, t.priority)}</select>
          <div class="src">${sourceNote(t.priority_source, t.ai_priority, t.priority, PRIS)}</div></td>
      <td><select data-field="status" class="st-${t.status}">${options(STATS, t.status)}</select></td>
    </tr>`).join("");
}

async function refresh() {
  const q = new URLSearchParams();
  if ($("fStatus").value) q.set("status", $("fStatus").value);
  if ($("fCat").value) q.set("category", $("fCat").value);
  if ($("fPri").value) q.set("priority", $("fPri").value);
  const [tickets, stats] = await Promise.all([api("/api/tickets?" + q), api("/api/stats")]);
  renderRows(tickets);
  renderStats(stats);
}

$("rows").addEventListener("change", async e => {
  const field = e.target.dataset.field;
  if (!field) return;
  const id = e.target.closest("tr").dataset.id;
  try { await api(`/api/tickets/${id}`, { method: "PATCH", body: JSON.stringify({ [field]: e.target.value }) }); }
  catch (err) { alert(err.message); }
  refresh();
});

$("auto").addEventListener("change", () => {
  const manual = !$("auto").checked;
  $("catWrap").hidden = !manual;
  $("cat").required = manual;
  $("pri").options[0].text = manual ? "Medium (default)" : "Let AI decide";
});

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("err").textContent = "";
  $("submit").disabled = true;
  const manual = !$("auto").checked;
  try {
    await api("/api/tickets", { method: "POST", body: JSON.stringify({
      title: $("title").value, description: $("desc").value, auto_classify: !manual,
      category: manual ? $("cat").value : null, priority: $("pri").value || null }) });
    $("form").reset();
    $("auto").dispatchEvent(new Event("change"));
    await refresh();
  } catch (err) { $("err").textContent = err.message; }
  $("submit").disabled = false;
});

async function init() {
  $("cat").innerHTML = options(CATS, "");
  $("pri").innerHTML = options(PRIS, "", "Let AI decide");
  $("fStatus").innerHTML = options(STATS, "", "All statuses");
  $("fCat").innerHTML = options(CATS, "", "All categories");
  $("fPri").innerHTML = options(PRIS, "", "All priorities");
  ["fStatus", "fCat", "fPri"].forEach(id => $(id).addEventListener("change", refresh));
  const cfg = await api("/api/config");
  $("clf").textContent = "Classifier: " + (cfg.classifier === "rules" ? "rule-based (no OpenAI key)" : cfg.classifier);
  if (!cfg.auto_classify_enabled) {
    $("auto").checked = false; $("auto").disabled = true;
    $("auto").parentElement.append(" (disabled by server setting)");
    $("auto").dispatchEvent(new Event("change"));
  }
  refresh();
}
init();
</script>
</body>
</html>
